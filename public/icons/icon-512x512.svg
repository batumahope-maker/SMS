<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#0d9488"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  <g fill="white" transform="translate(256, 280)">
    <!-- Graduation Cap -->
    <polygon points="0,-100 150,-30 0,40 -150,-30" opacity="0.9"/>
    <polygon points="0,-100 150,-30 0,40 -150,-30" fill="white"/>
    <rect x="-20" y="40" width="40" height="60"/>
    <rect x="-60" y="90" width="120" height="15" rx="5"/>
    <!-- Tassel -->
    <circle cx="80" cy="-10" r="15"/>
    <rect x="75" y="0" width="10" height="50"/>
    <ellipse cx="80" cy="60" rx="20" ry="25"/>
  </g>
</svg>
